# Pre-commit hooks — prevent secret leaks and other common mistakes.
# Install:  brew install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
#
# See CURRENT_TASK.md session 1 for context. Added after the 47a18ec .env leak.

repos:
  # 1. Gitleaks — scans for secrets (API keys, tokens, private keys)
  #    Covers Alpaca, Binance, Telegram tokens, AWS keys, generic high-entropy strings.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # 2. Standard pre-commit hooks — cheap, well-maintained safety net
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key        # SSH / PGP / generic private keys
      - id: check-added-large-files   # default 500KB — blocks big binaries
        args: ['--maxkb=500']
      - id: check-merge-conflict      # stray <<<<<<< markers
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # 3. Custom local hook — hard-refuse any .env file except .env.example
  #    Backstop in case gitleaks or .gitignore is bypassed.
  - repo: local
    hooks:
      - id: no-env-files
        name: Block .env files from being committed
        entry: python3 scripts/hooks/no_env_files.py
        language: system
        pass_filenames: true
        always_run: false
